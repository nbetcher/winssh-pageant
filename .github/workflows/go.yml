name: Go

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read

jobs:

  lint:
    name: Lint
    runs-on: ubuntu-latest
    env:
      # gofmt is build-tag agnostic; vet targets the (bulk) Windows build.
      GOOS: windows
    steps:
      - name: Check out code into the Go module directory
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Check formatting
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

      - name: Vet
        # The unsafeptr analyzer flags the unavoidable uintptr<->Pointer
        # conversions used for the Win32 shared-memory / WM_COPYDATA interop.
        run: go vet -unsafeptr=false ./...

  build:
    name: Build & Test
    runs-on: windows-latest
    steps:
      - name: Check out code into the Go module directory
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: go build -v ./...

      - name: Test
        run: go test -v ./...

      # Run revive via the toolchain installed above (a pinned Docker action
      # would bundle its own, possibly older, Go that cannot load this module).
      - name: Run Revive
        run: go run github.com/mgechev/revive@latest -config resources/revive.toml ./...

      - name: Vet & compile-check non-Windows build
        # The pageant package also has a //go:build !windows variant (run_others.go).
        run: go vet ./pageant/
        env:
          GOOS: linux
